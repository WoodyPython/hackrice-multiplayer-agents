<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CoFlow">
  <title>CoFlow</title>
  <!--
    The CoFlow mark as a tab icon, derived from LogoMark in
    src/components/Logo.tsx. Two deliberate differences from the in-app mark:

    1. It sits on a filled navy tile rather than inheriting currentColor. A tab
       strip can be light or dark and the icon cannot ask which, so a navy mark
       on transparent would vanish against dark chrome. The tile is the same
       inversion the sidebar already uses (Wordmark tone="invert").
    2. Three checklist rows, not four, with heavier strokes. At 16px the
       four-row mark collapses into a grey smudge; the row count is not what
       makes it recognisable, the page-plus-flow-bar silhouette is.
  -->
  <rect width="32" height="32" rx="7.5" fill="#24375c" />
  <g
    transform="translate(6.6 5.1) scale(0.72)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="1" y="2" width="18" height="28" rx="3.5" />
    <path d="M24.5 3.4v25.2" />
    <path d="M5.4 9.2l1.9 2 3.4-4" />
    <path d="M13.2 8.9h3.8" />
    <path d="M5.4 16.4l1.9 2 3.4-4" />
    <path d="M13.2 16.1h3.8" />
    <path d="M5.4 23.6l1.9 2 3.4-4" />
    <path d="M13.2 23.3h3.8" />
  </g>
</svg>
