<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="CoFlow — a shared workspace where collaborators shape a task together, parallel agents do the work, and every change is reviewed before it is applied."
    />
    <title>CoFlow — a shared workspace for agent-assisted work</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg" color="#24375c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Stamp the stored theme before first paint, so a dark-mode reader never
      // sees a flash of the light canvas. The app re-applies this on mount.
      (function () {
        try {
          var stored = localStorage.getItem("coflow.theme.v1");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark)
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#12161f");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
